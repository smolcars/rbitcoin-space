[package]
name = "rbitcoin-space"
description = "The rbitcoin.space server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arkade.workspace = true
bark.workspace = true
card.workspace = true
engine.workspace = true
ln.workspace = true
node.workspace = true

axum.workspace = true
bitcoin.workspace = true
hyper = { workspace = true, features = ["server"] }
hyper-util.workspace = true
logging.workspace = true
serde.workspace = true
# `raw_value`: `rbfLatest` carries the list `/api/v1/replacements` keeps, serialized once.
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true, features = ["sync", "time"] }
tower.workspace = true
tower-http.workspace = true

[dev-dependencies]
# Already built for `ln`: the tests build a real graph to copy from.
lightning.workspace = true
# A feature, not a crate: paused clocks for the timing tests.
tokio = { workspace = true, features = ["test-util"] }

[features]
# Turns the WebSocket hub into an echo server for the conformance suite (dev/autobahn). Never in
# a release build.
autobahn = []

[lints]
workspace = true
