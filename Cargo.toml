[workspace]
resolver = "3"
members = ["crates/*", "dev/load"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
arkade = { path = "crates/arkade" }
bark = { path = "crates/bark" }
card = { path = "crates/card" }
engine = { path = "crates/engine" }
ln = { path = "crates/ln" }
logging = { path = "crates/logging" }
node = { path = "crates/node" }

# Link preview cards (crates/card): coverage from outlines, for text and shapes alike. Its std
# feature only; no libm.
ab_glyph_rasterizer = "0.1.10"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "tokio"] }
bitcoin = { version = "0.32.102", default-features = false, features = ["std", "serde"] }
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
# The cards' PNG compression: deflate only, without its SIMD checksum.
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
# LDK, for the gossip-only Lightning peer (docs/LIGHTNING.md). No default features: drops
# grind_signatures, which only matters when signing channel transactions. 0.2.8 is the newest
# release; lightning-net-tokio's newest 0.2 release is 0.2.0.
lightning = { version = "0.2.8", default-features = false, features = ["std"] }
lightning-net-tokio = "0.2.0"
# Bundled: a pinned SQLite compiled in, so neither CI nor the distroless image needs libsqlite3.
# hooks: the progress handler that enforces the read time limit. Adds no crates.
rusqlite = { version = "0.42.0", default-features = false, features = ["bundled", "hooks"] }
# Outbound TLS, for the Bark and Arkade servers (docs/ARK.md). ring rather than aws-lc-rs: no C
# toolchain or cmake, and a smaller build. TLS 1.3 only: no tls12 feature.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
# The cards' font outlines. No layout, variation or glyph-name tables: a static subset needs none.
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tower-service = "0.3.3"
webpki-roots = { version = "1.0.12", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# No panics on untrusted input (SECURITY.md rule 18). Tests opt out locally.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# Output goes through the `logging` crate as typed events (docs/LOGGING.md). Tests and examples opt out locally.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

# secp256k1's C library compiled at -O0 made signature checks most of the Lightning tests' time.
# Optimised it builds once into the cache and checks signatures about twenty times faster.
[profile.dev.package.secp256k1-sys]
opt-level = 3

# A card unoptimised took about a second to draw, most of the card tests' time; optimised, a few
# milliseconds. Built once into the cache like the dependencies.
[profile.dev.package.card]
opt-level = 3
[profile.dev.package.ab_glyph_rasterizer]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
